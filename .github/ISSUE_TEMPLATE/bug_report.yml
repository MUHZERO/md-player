name: Bug report
description: Report a reproducible md_player_android defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code or a public/synthetic fixture. Remove credentials and signed URLs.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package, Flutter, Android API, and device/emulator versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, headers, private URLs, paths, and device serials.
