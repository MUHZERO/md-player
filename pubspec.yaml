name: md_player_android
description: Flutter video player for Android (Media3, merged YouTube streams, quality switching, caching) and iOS (AVFoundation via video_player_avfoundation), with opt-in modern controls.
repository: https://github.com/MUHZERO/md-player
issue_tracker: https://github.com/MUHZERO/md-player/issues
version: 2.8.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

flutter:
  plugin:
    implements: video_player
    platforms:
      android:
        dartPluginClass: MdPlayerAndroid
        package: io.flutter.plugins.videoplayer
        pluginClass: VideoPlayerPlugin

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.12.0
  # iOS implementation of video_player. Not declared as an iOS platform
  # here on purpose: being the only iOS candidate, Flutter registers both its
  # Dart class and its native AVPlayer plugin.
  video_player_avfoundation: ^2.9.4
  video_player_platform_interface: ">=6.1.0 <7.0.0"
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: 27.1.1

topics:
  - video
  - video-player
  - media3
  - avfoundation
  - youtube
