name: md_player_android
description: Android Flutter video player with Media3 playback, manual quality switching, optional caching, and opt-in modern controls.
repository: https://github.com/MUHZERO/md-player
issue_tracker: https://github.com/MUHZERO/md-player/issues
version: 2.7.3

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

flutter:
  plugin:
    implements: video_player
    platforms:
      android:
        dartPluginClass: MdPlayerAndroid
        package: io.flutter.plugins.videoplayer
        pluginClass: VideoPlayerPlugin

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.12.0
  video_player_platform_interface: ">=6.1.0 <7.0.0"
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: 27.1.1

topics:
  - video
  - video-player
  - media3
  - youtube
